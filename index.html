<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="format-detection" content="telephone=no">

  <title>Ofrendas y Donaciones | Iglesia Jesucristo Rey y Señor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #08192f;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #1a3b68 0%, #102b50 38%, #08192f 100%);
      color: white;
      padding: 26px 18px 35px;
    }

    .page {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* LOGO */

    .logo {
      display: block;
      width: 92px;
      height: 92px;
      object-fit: contain;
      margin: 0 auto 14px;
    }

    /* ENCABEZADO */

    .header {
      text-align: center;
    }

    .church {
      font-size: 13px;
      letter-spacing: 2.6px;
      font-weight: 700;
      line-height: 1.5;
    }

    .eyebrow {
      margin-top: 21px;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      color: #d4deeb;
      font-size: 16px;
    }

    h1 {
      margin-top: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 43px;
      line-height: 1.02;
      font-weight: 400;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 13px auto 0;
      max-width: 390px;
      color: #afc0d5;
      font-size: 14px;
      line-height: 1.55;
    }

    /* TARJETA */

    .card {
      margin-top: 24px;
      padding: 25px 22px 22px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.075);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .bank {
      color: #b8d4fb;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 22px;
    }

    .data-block {
      margin-bottom: 20px;
    }

    .label {
      color: #91a8c3;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      margin-bottom: 7px;
    }

    .value {
      color: #ffffff !important;
      text-decoration: none !important;
      font-size: 27px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      -webkit-text-fill-color: #ffffff;
    }

    .rnc-value {
      font-size: 23px;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 14px;
      background: #ffffff;
      color: #10294a;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.15px;
      cursor: pointer;
      padding: 14px 16px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.93;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,.10);
      margin: 22px 0;
    }

    /* MENSAJE FINAL */

    .message {
      text-align: center;
      max-width: 360px;
      margin: 22px auto 0;
      color: #c3cfdd;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 14px;
      line-height: 1.55;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #758aa4;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* NOTIFICACIÓN COPIADO */

    #toast {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      background: white;
      color: #10294a;
      padding: 12px 18px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      visibility: hidden;
      transition: 0.25s ease;
      box-shadow: 0 12px 35px rgba(0,0,0,.28);
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* OPTIMIZACIÓN PARA CELULAR */

    @media (max-width: 600px) {

      body {
        padding: 18px 16px 28px;
      }

      .logo {
        width: 70px;
        height: 70px;
        margin-bottom: 9px;
      }

      .church {
        font-size: 11px;
        letter-spacing: 2.2px;
      }

      .eyebrow {
        margin-top: 15px;
        font-size: 14px;
      }

      h1 {
        font-size: 38px;
        margin-top: 3px;
      }

      .subtitle {
        margin-top: 9px;
        font-size: 13px;
        line-height: 1.45;
      }

      .card {
        margin-top: 18px;
        padding: 22px 19px 20px;
        border-radius: 22px;
      }

      .bank {
        margin-bottom: 18px;
        font-size: 13px;
      }

      .value {
        font-size: 26px;
      }

      .rnc-value {
        font-size: 22px;
      }

      button {
        min-height: 52px;
        font-size: 12px;
      }

      .divider {
        margin: 19px 0;
      }

      .message {
        margin-top: 18px;
        font-size: 13px;
      }
    }

    /* TELÉFONOS PEQUEÑOS */

    @media (max-width: 380px) {

      h1 {
        font-size: 34px;
      }

      .value {
        font-size: 24px;
      }

      .card {
        padding-left: 17px;
        padding-right: 17px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <header class="header">

      <img
        class="logo"
        src="LOGO BLANCO HD.png"
        alt="Logo Iglesia Jesucristo Rey y Señor"
      >

      <div class="church">
        IGLESIA JESUCRISTO<br>
        REY Y SEÑOR
      </div>

      <div class="eyebrow">
        Una forma sencilla de aportar
      </div>

      <h1>
        Ofrendas &<br>
        Donaciones
      </h1>

      <p class="subtitle">
        Gracias por contribuir y ser parte de la obra que Dios está haciendo.
      </p>

    </header>


    <section class="card">

      <div class="bank">
        BANRESERVAS
      </div>


      <div class="data-block">

        <div class="label">
          Número de cuenta
        </div>

        <div class="value">
          9605763918
        </div>

        <button onclick="copiar('9605763918', 'Número de cuenta copiado')">
          COPIAR NÚMERO DE CUENTA
        </button>

      </div>


      <div class="divider"></div>


      <div class="data-block" style="margin-bottom:0;">

        <div class="label">
          RNC
        </div>

        <div class="value rnc-value">
          430144894
        </div>

        <button onclick="copiar('430144894', 'RNC copiado')">
          COPIAR RNC
        </button>

      </div>

    </section>


    <p class="message">
      “Dios bendiga cada semilla sembrada con amor.”
    </p>


    <div class="footer">
      Iglesia Jesucristo Rey y Señor
    </div>

  </main>


  <div id="toast">
    Copiado ✓
  </div>


  <script>

    async function copiar(texto, mensaje) {

      try {

        await navigator.clipboard.writeText(texto);

        mostrarToast(mensaje + " ✓");

      } catch (error) {

        const temporal = document.createElement("textarea");

        temporal.value = texto;
        temporal.style.position = "fixed";
        temporal.style.opacity = "0";

        document.body.appendChild(temporal);

        temporal.select();

        document.execCommand("copy");

        temporal.remove();

        mostrarToast(mensaje + " ✓");
      }
    }


    function mostrarToast(mensaje) {

      const toast = document.getElementById("toast");

      toast.textContent = mensaje;

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

  </script>

</body>
</html>
