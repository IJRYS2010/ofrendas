<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0d2b50">

  <title>Ofrendas y Donaciones | Iglesia Jesucristo Rey y Señor</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      background:#071a31;
    }

    body{
      min-height:100vh;
      font-family:Arial, Helvetica, sans-serif;
      color:#ffffff;

      background:
        radial-gradient(
          circle at top,
          #194875 0%,
          #10355d 38%,
          #071a31 100%
        );

      padding:22px 16px 34px;
    }

    .page{
      width:100%;
      max-width:500px;
      margin:0 auto;
    }


    /* =========================
       LOGO IGLESIA
    ========================= */

    .church-header{
      text-align:center;
    }

    .church-logo{
      display:block;
      width:76px;
      height:76px;
      object-fit:contain;
      margin:0 auto 8px;
    }

    .church-name{
      font-size:11px;
      line-height:1.5;
      font-weight:700;
      letter-spacing:2.5px;
      text-transform:uppercase;
    }


    /* =========================
       TITULO
    ========================= */

    .hero{
      text-align:center;
      margin-top:15px;
    }

    .eyebrow{
      font-family:Georgia, "Times New Roman", serif;
      font-style:italic;
      font-size:15px;
      color:#d8e2ee;
      margin-bottom:3px;
    }

    h1{
      font-family:Georgia, "Times New Roman", serif;
      font-weight:400;

      font-size:39px;
      line-height:.98;

      letter-spacing:-1px;

      margin:0;
    }

    .description{
      max-width:360px;

      margin:10px auto 0;

      font-size:13px;
      line-height:1.4;

      color:#b7c8db;
    }


    /* =========================
       TARJETA BANCO
    ========================= */

    .card{
      margin-top:19px;

      background:rgba(39,69,105,.82);

      border:1px solid rgba(255,255,255,.18);
      border-radius:24px;

      padding:22px 19px;

      box-shadow:
        0 18px 45px rgba(0,0,0,.18);
    }


    /* FILA CUENTA */

    .account-row{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .account-info{
      flex:1;
      min-width:0;
    }

    .label{
      color:#9fb5ce;

      font-size:11px;

      letter-spacing:1.8px;
      text-transform:uppercase;

      margin-bottom:7px;
    }

    .number{
      color:#ffffff !important;

      -webkit-text-fill-color:#ffffff !important;

      text-decoration:none !important;

      font-size:27px;
      font-weight:800;

      line-height:1;

      letter-spacing:.5px;

      white-space:nowrap;
    }


    /* LOGO BANRESERVAS */

    .bank-logo{
      width:52px;
      height:52px;

      object-fit:contain;

      flex:0 0 52px;

      background:transparent;

      border:none;

      padding:0;
    }


    /* BOTONES */

    .copy-button{
      width:100%;

      margin-top:17px;

      border:none;
      border-radius:15px;

      background:#ffffff;
      color:#102d50;

      padding:17px 14px;

      font-size:13px;
      font-weight:800;

      cursor:pointer;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    .copy-button:active{
      transform:scale(.98);
      opacity:.92;
    }


    /* SEPARADOR */

    .divider{
      height:1px;

      background:rgba(255,255,255,.14);

      margin:22px 0;
    }


    /* RNC */

    .rnc-number{
      font-size:25px;
    }


    /* =========================
       MENSAJE FINAL
    ========================= */

    .footer{
      text-align:center;

      padding:21px 5px 0;
    }

    .blessing{
      font-family:Georgia, "Times New Roman", serif;

      font-style:italic;

      color:#d2dce8;

      font-size:15px;
      line-height:1.5;

      margin-bottom:18px;
    }

    .footer-name{
      color:#8298b2;

      font-size:9px;
      line-height:1.5;

      letter-spacing:1.8px;

      text-transform:uppercase;
    }


    /* =========================
       MENSAJE COPIADO
    ========================= */

    #toast{
      position:fixed;

      left:50%;
      bottom:25px;

      transform:
        translateX(-50%)
        translateY(20px);

      background:#ffffff;
      color:#102d50;

      padding:12px 18px;

      border-radius:40px;

      font-size:13px;
      font-weight:700;

      box-shadow:
        0 12px 30px rgba(0,0,0,.25);

      opacity:0;
      visibility:hidden;

      transition:.25s;

      white-space:nowrap;
    }

    #toast.show{
      opacity:1;
      visibility:visible;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =========================
       CELULAR
    ========================= */

    @media(max-width:600px){

      body{
        padding:
          20px
          14px
          30px;
      }

      .church-logo{
        width:68px;
        height:68px;
      }

      .church-name{
        font-size:10.5px;
        letter-spacing:2.3px;
      }

      .hero{
        margin-top:13px;
      }

      .eyebrow{
        font-size:14px;
      }

      h1{
        font-size:36px;
      }

      .description{
        margin-top:8px;

        font-size:12.5px;
      }

      .card{
        margin-top:17px;

        padding:
          20px
          17px;
      }

      .label{
        font-size:10.5px;
      }

      .number{
        font-size:25px;
      }

      .rnc-number{
        font-size:23px;
      }

      .bank-logo{
        width:48px;
        height:48px;

        flex-basis:48px;
      }

      .copy-button{
        padding:15px 12px;

        font-size:12.5px;
      }

      .divider{
        margin:20px 0;
      }

      .footer{
        padding-top:18px;
      }

      .blessing{
        font-size:14px;
      }

    }


    @media(max-width:380px){

      h1{
        font-size:33px;
      }

      .number{
        font-size:22px;
      }

      .rnc-number{
        font-size:21px;
      }

      .bank-logo{
        width:43px;
        height:43px;

        flex-basis:43px;
      }

    }

  </style>
</head>


<body>

  <main class="page">


    <!-- IGLESIA -->

    <header class="church-header">

      <img
        class="church-logo"
        src="LOGO OPTIMIZADO.png"
        alt="Iglesia Jesucristo Rey y Señor"
      >

      <div class="church-name">
        IGLESIA JESUCRISTO<br>
        REY Y SEÑOR
      </div>

    </header>



    <!-- TITULO -->

    <section class="hero">

      <div class="eyebrow">
        Una forma sencilla de aportar
      </div>

      <h1>
        Ofrendas &<br>
        Donaciones
      </h1>

      <p class="description">
        Gracias por contribuir y ser parte
        de la obra que Dios está haciendo.
      </p>

    </section>



    <!-- DATOS -->

    <section class="card">


      <!-- CUENTA -->

      <div class="account-row">

        <div class="account-info">

          <div class="label">
            Número de cuenta
          </div>

          <div class="number">
            9605763918
          </div>

        </div>


        <img
          class="bank-logo"
          src="logo-banreservas.png"
          alt="Banreservas"
        >

      </div>


      <button
        class="copy-button"
        onclick="copiar(
          '9605763918',
          'Número de cuenta copiado'
        )"
      >
        COPIAR NÚMERO DE CUENTA
      </button>



      <div class="divider"></div>



      <!-- RNC -->

      <div class="label">
        RNC
      </div>

      <div class="number rnc-number">
        430144894
      </div>


      <button
        class="copy-button"
        onclick="copiar(
          '430144894',
          'RNC copiado'
        )"
      >
        COPIAR RNC
      </button>


    </section>



    <!-- FINAL -->

    <footer class="footer">

      <div class="blessing">
        “Dios bendiga cada semilla sembrada con amor.”
      </div>

      <div class="footer-name">
        Iglesia Jesucristo Rey y Señor
      </div>

    </footer>


  </main>


  <div id="toast">
    Copiado ✓
  </div>



  <script>

    async function copiar(texto,mensaje){

      try{

        await navigator.clipboard.writeText(texto);

        mostrarToast(mensaje + " ✓");

      }

      catch(error){

        const area =
          document.createElement("textarea");

        area.value = texto;

        area.style.position = "fixed";
        area.style.opacity = "0";

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        mostrarToast(mensaje + " ✓");

      }

    }


    function mostrarToast(mensaje){

      const toast =
        document.getElementById("toast");

      toast.textContent = mensaje;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      },1800);

    }

  </script>


</body>
</html>
